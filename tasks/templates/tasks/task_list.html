<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskList</title>


</head>
<body>
<form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Title" required>
    <button type="submit">Add Task</button>
</form>
  <h1>My tasks</h1>
<ul>
    {% for task in tasks %}
    <li> {{ task.title }}</li>
    {% endfor %}

    </ul>
</body>
</html>
